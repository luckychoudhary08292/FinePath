<!doctype html>
<html lang="en">
  <head>
    <script>
      // Gracefully handle [vite] WebSocket / HMR messages in iframe environment where HMR is disabled
      (function() {
        const isViteOrWs = function(str) {
          if (!str || typeof str !== 'string') return false;
          return str.includes('[vite]') || str.includes('WebSocket') || str.includes('ws://') || str.includes('wss://');
        };
        const origError = console.error;
        console.error = function(...args) {
          if (args.some(a => isViteOrWs(typeof a === 'string' ? a : a?.message))) return;
          origError.apply(console, args);
        };
        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(a => isViteOrWs(typeof a === 'string' ? a : a?.message))) return;
          origWarn.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if (isViteOrWs(e.message) || isViteOrWs(e.filename)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          const reason = e.reason ? String(e.reason?.message || e.reason) : '';
          if (isViteOrWs(reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
